name: CI

on:
  pull_request: {}
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx next build
        env:
          # Build-time placeholder; real secrets live in the deploy environment.
          JWT_SECRET: ci-build-placeholder-secret-min-32-characters
