name: E2E

# Full-stack browser specs. Deliberately NOT on every PR (they build the app and drive a
# real browser, so they're slow) — run them on demand or nightly before a deploy.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 2 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employees_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e specs
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/employees_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
